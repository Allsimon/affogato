<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>affogato playground</title>
<style>
:root { color-scheme: light dark; --border: #8884; --muted: #888; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: .75em 1.25em; padding: .6em 1em; border-bottom: 1px solid var(--border); }
header h1 { font-size: 1.05em; margin: 0 .5em 0 0; }
header label { display: flex; align-items: center; gap: .35em; }
header select, header button { font: inherit; }
#status { color: var(--muted); margin-left: auto; }
#editor { min-height: 0; }
</style>
</head>
<body>
<header>
  <h1>affogato playground</h1>
  <button id="format" type="button" title="Format Document (Shift+Alt+F)">Format</button>
  <button id="fix" type="button" title="Apply the linter's fixes">Fix all</button>
  <label title="Lint with one rule, starting from its test case">Rule <select id="rule"><option value="">All rules</option></select></label>
  <span id="status">Starting…</span>
</header>
<div id="editor"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
